<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6ef">
<title>الوجه الصيني | العمليات الأربع</title>
<meta name="description" content="استكشف الجمع والطرح والضرب والقسمة بالأعداد الصحيحة، وتدرّب على إشارة الناتج ومعادلات من خطوة واحدة.">
<style id="app-style">
:root {
  color-scheme: light;
  --paper:#f8f7f2; --card:#fffefa; --ink:#212f2b; --muted:#566760; --line:#d8e0d8;
  --teal:#0f665a; --teal-dark:#084f46; --mint:#e7f4ea; --mint-ink:#22614e;
  --stage:#eff4e7; --stage-dot:#afc7ae; --ring:#d2dfc9; --field:#f5f5ee;
  --sun:#ffbf21; --red:#c44934; --warn:#884d17; --warning-bg:#fff1dd;
  --shadow:0 8px 32px rgba(29,55,42,.06);
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;
}
:root[data-theme=dark] {
  color-scheme:dark; --paper:#15231f; --card:#1c3029; --ink:#f0f5ec; --muted:#b6c9bc;
  --line:#3b5145; --teal:#96dfc8; --teal-dark:#b3eed5; --mint:#284638; --mint-ink:#b1e6c6;
  --stage:#263c30; --stage-dot:#536f58; --ring:#415a47; --field:#273a30;
  --warn:#ffcf8c; --warning-bg:#493a27; --shadow:none;
}
html{scrollbar-gutter:stable}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);line-height:1.65}
button,a{font:inherit;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;color:inherit}
button:disabled{cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
[hidden]{display:none!important}
.wrap{width:min(1096px,calc(100% - 64px));margin:auto}
.top{border-bottom:1px solid var(--line);background:var(--card)}
.top-inner,.brand,.tools,.mode-switch,.op-switch,.box-head,.actions,.answers,.face-head,.foot-inner,.choice-dots{display:flex;align-items:center}
.top-inner,.box-head,.foot-inner,.face-head{justify-content:space-between}
.top-inner{min-height:72px;gap:12px}
.brand{gap:10px;font-weight:700}
.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--ink);color:var(--paper);direction:ltr;font:700 24px/1 Georgia,serif}
.tools,.actions,.answers{gap:8px;flex-wrap:wrap}
.small-btn,.soft-btn,.primary,.switch-btn,.answer{border:1px solid var(--line);border-radius:11px;min-height:43px;padding:7px 15px;background:var(--card);font-weight:600}
.small-btn,.soft-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.small-btn svg,.soft-btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
button:not(:disabled):hover{filter:brightness(.96)}
main{padding:34px 0 30px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:25px}
h1,h2,p{margin:0}
h1{font-size:clamp(2.15rem,4.3vw,3.15rem);line-height:1.38;letter-spacing:-.065rem}
.intro p{color:var(--muted);margin-top:4px;font-size:1.04rem}
.mode-switch{gap:3px;width:max-content;background:var(--field);padding:4px;border:1px solid var(--line);border-radius:15px}
.switch-btn{border:0;background:transparent;color:var(--muted);min-height:39px;padding:6px 19px}
.mode-switch .switch-btn[aria-pressed=true]{background:var(--teal);color:var(--paper)}

.op-switch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.op-choice{display:flex;align-items:center;justify-content:center;gap:9px;min-height:54px;padding:7px 8px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-weight:700}
.op-choice[aria-pressed=true]{background:var(--mint);border:2px solid var(--teal);padding:6px 7px;color:var(--teal)}
.op-icon{display:grid;place-items:center;direction:ltr;width:31px;height:31px;border-radius:9px;background:var(--field);font:700 25px/1 Arial,sans-serif}
.op-choice[aria-pressed=true] .op-icon{background:var(--teal);color:var(--paper)}

.workspace{display:grid;grid-template-columns:minmax(0,.97fr) minmax(0,1.08fr);gap:18px;align-items:stretch}
.face-board,.lesson{border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.face-board{background-color:var(--stage);background-image:radial-gradient(var(--stage-dot) .75px,transparent .9px);background-size:15px 15px;position:relative;align-self:start;height:clamp(400px,40vw,452px);--orbit:clamp(228px,26vw,312px)}
.face-head{position:absolute;inset:16px 22px auto;gap:10px}
.face-head strong{font-weight:700}
.choice-dots{gap:5px;direction:ltr}
.choice-dots i{width:10px;height:10px;border:1.5px solid var(--teal);border-radius:50%;background:var(--stage)}
.choice-dots i.on{background:var(--teal)}
.face-space{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:var(--orbit);height:var(--orbit);border:1px dashed var(--ring);border-radius:50%;direction:ltr}
.face{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:79%;height:79%;direction:ltr;border-radius:50%;background:radial-gradient(at 32% 22%,#ffe47b 0%,#ffd04d 25%,#ffbe28 63%,#efa018 89%,#d68614 100%);box-shadow:inset 0 -7px 0 #c9862038,inset 0 3px 3px #fff2b4aa,0 15px 19px -10px #71551b55}
.face::before{content:"";position:absolute;top:9%;left:17%;width:25%;height:7%;border-radius:50%;transform:rotate(-33deg);background:linear-gradient(90deg,transparent,#fff3b099,transparent)}
.mark{position:absolute;transform:translate(-50%,-50%);width:29%;height:29%;display:grid;place-items:center;border:0;border-radius:50%;padding:0;background:transparent;transition:background .18s}
.mark[data-key=left]{left:32%;top:39%}.mark[data-key=right]{left:68%;top:39%}.mark[data-key=mouth]{left:50%;top:68%}
.glyph{width:84%;height:84%;filter:drop-shadow(0 3px 0 #6d451855)}
.mark.covered .glyph{visibility:hidden}
.mark.covered:after{content:"";position:absolute;width:67%;height:67%;border-radius:50%;background:repeating-linear-gradient(135deg,#ffe098 0 5px,#f5c863 5px 10px);border:2px dashed #a97727}
.mark.remaining{background:#ffefb5;box-shadow:0 0 0 2px #ffffff90}
.face-note{position:absolute;inset:auto 12px 10px;text-align:center;color:var(--muted);font-size:.94rem}
.lesson{background:var(--card);padding:25px 27px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.box-head{gap:12px;flex-wrap:wrap;margin-bottom:17px}
h2{font-size:1.43rem;line-height:1.55}
 .chip-field{display:flex;flex-flow:row wrap;align-items:center;gap:6px 16px;margin:12px 0}
.chip-run{display:flex;gap:3px;flex-wrap:wrap}
.chip{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid currentColor;font:700 16px/1 Arial,sans-serif;direction:ltr}
.chip.plus{color:var(--teal);background:var(--mint)}.chip.minus{color:var(--warn);background:var(--warning-bg)}
.chip.cancelled{background:transparent;border-style:dashed;opacity:.5;text-decoration:line-through}
.zero-on-face{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);border-radius:50%;width:32%;height:32%;display:grid;place-items:center;background:#fff0b7;color:#654818;font-size:clamp(23px,3vw,36px);font-weight:700}
.face.zero-result .glyph{opacity:.38}

.sub,.count{color:var(--muted);font-size:.95rem}
.math-board{background:var(--field);border:1px solid var(--line);border-radius:16px;padding:14px clamp(10px,2vw,22px) 17px;margin:17px 0;overflow:hidden}
/* The first operand is the rightmost grid item. Each signed number is isolated LTR. */
.math-line{direction:rtl;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,.65fr);align-items:end;gap:clamp(5px,1.3vw,16px);text-align:center}
.math-group{display:grid;gap:7px;justify-items:center}
.math-caption{color:var(--muted);font-size:.78rem}
.math-parts{display:flex;direction:rtl;flex-flow:row nowrap;justify-content:center;align-items:baseline;gap:clamp(3px,1.2vw,13px);width:100%;white-space:nowrap}
.math-token,.equals{font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-weight:700;line-height:1.55;font-size:clamp(1.45rem,3.3vw,2.2rem);color:var(--ink)}
.math-token{display:inline-block;direction:ltr;unicode-bidi:isolate-override;white-space:nowrap}
.math-out{color:var(--teal)}
.equals{color:var(--muted);padding:0 .1em}
.feedback{color:var(--mint-ink);padding:10px 13px;background:var(--mint);border-radius:10px;margin:12px 0;line-height:1.75}
.feedback.retry{color:var(--warn);background:var(--warning-bg)}
.actions,.answers{margin-top:12px}
.primary{background:var(--teal);border-color:var(--teal);color:var(--paper)}
.soft-btn{color:var(--teal)}
.answer{min-width:90px;color:var(--teal);background:var(--mint);border-color:var(--line)}
.answer bdi{margin-inline-start:.25em}
.progress{width:100%;accent-color:var(--teal);height:6px;display:block;border:0;border-radius:8px;overflow:hidden;background:var(--field)}
progress::-webkit-progress-bar{background:var(--field)}progress::-webkit-progress-value{background:var(--teal)}progress::-moz-progress-bar{background:var(--teal)}
.foot-inner{gap:8px;flex-wrap:wrap;padding:20px 0;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media(min-width:1200px){main{padding-top:45px}}
@media(max-width:760px){.wrap{width:min(100% - 32px,620px)}.intro{align-items:start;flex-direction:column;gap:14px}.workspace{grid-template-columns:1fr}.face-board{height:294px;--orbit:194px}.face-head{inset:10px 16px auto}.face-note{font-size:.86rem;inset:auto 10px 9px}.lesson{padding:18px}.top-inner{min-height:60px}.math-token,.equals{font-size:1.7rem}main{padding:20px 0}.intro{margin-bottom:17px}}
@media(max-width:460px){.wrap{width:calc(100% - 22px)}.top-inner{gap:8px}.small-btn{padding:6px 10px}.brand{font-size:.92rem;gap:6px}.brand-mark{width:29px;height:29px}.tools{gap:5px}.theme-label{display:none}.theme-btn{min-width:42px}.workspace{gap:12px}.face-board,.lesson{border-radius:18px}.intro p{font-size:.94rem}.math-token,.equals{font-size:1.45rem}.op-switch{gap:5px}.op-choice{flex-direction:column;gap:2px;font-size:.87rem}.face-board{height:266px;--orbit:186px}}
@media(prefers-reduced-motion:no-preference){.remaining .glyph{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.7)}70%{transform:scale(1.11)}100%{transform:scale(1)}}}
</style>
</head>
<body>
<header class="top"><div class="wrap top-inner">
  <div class="brand"><span class="brand-mark" aria-hidden="true">±</span><span>رياضيات تفاعلية</span></div>
  <div class="tools">
    <button class="small-btn theme-btn" id="theme" aria-label="تفعيل الوضع الليلي" title="تبديل المظهر"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14a8 8 0 0 1-10-10A8.5 8.5 0 1 0 20 14Z"/></svg><span class="theme-label">المظهر</span></button>
  </div>
</div></header>
<main class="wrap">
  <div class="intro">
    <div><h1>الوجه الصيني</h1><p>اكتشف إشارة الناتج في العمليات الأربع.</p></div>
    <nav class="mode-switch" aria-label="اختيار النشاط">
      <button class="switch-btn" type="button" data-mode="explore" aria-pressed="true">استكشاف</button>
      <button class="switch-btn" type="button" data-mode="practice" aria-pressed="false">تدريب</button>
    </nav>
  </div>
  <nav class="op-switch" aria-label="اختيار العملية">
    <button class="op-choice" type="button" data-op="+" aria-pressed="false"><span class="op-icon" aria-hidden="true">+</span>الجمع</button>
    <button class="op-choice" type="button" data-op="−" aria-pressed="false"><span class="op-icon" aria-hidden="true">−</span>الطرح</button>
    <button class="op-choice" type="button" data-op="×" aria-pressed="false"><span class="op-icon" aria-hidden="true">×</span>الضرب</button>
    <button class="op-choice" type="button" data-op="÷" aria-pressed="true"><span class="op-icon" aria-hidden="true">÷</span>القسمة</button>
  </nav>
  <div class="workspace">
    <section class="face-board" aria-label="الوجه التفاعلي">
      <div class="face-head"><strong>لوحة الإشارات</strong><div class="choice-dots" aria-hidden="true"><i></i><i></i></div></div>
      <div class="face-space"><div class="face" role="group" aria-label="عينان بعلامتَي سالب وفم بعلامة موجب">
        <button class="mark" type="button" data-key="left" aria-label="العين اليسرى، سالب" aria-pressed="false"><svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="26" width="54" height="13" rx="4" fill="#cb4836"/></svg></button>
        <button class="mark" type="button" data-key="right" aria-label="العين اليمنى، سالب" aria-pressed="false"><svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><rect x="5" y="26" width="54" height="13" rx="4" fill="#cb4836"/></svg></button>
        <button class="mark" type="button" data-key="mouth" aria-label="الفم، موجب" aria-pressed="false"><svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><path d="M27 5h10q2 0 2 2v18h18q2 0 2 2v10q0 2-2 2H39v18q0 2-2 2H27q-2 0-2-2V39H7q-2 0-2-2V27q0-2 2-2h18V7q0-2 2-2z" fill="#148979"/></svg></button>
        <span class="zero-on-face" id="zero-face" aria-hidden="true" hidden>٠</span>
      </div></div>
      <p class="face-note" id="face-note">اضغط على علامتين لتغطية إشارتَي العددين.</p>
    </section>
    <section class="lesson" aria-label="العملية ونتيجتها">
      <div id="explore">
        <div class="box-head"><h2 id="explore-title">استكشف الإشارة</h2></div>
        <p class="sub" id="instruction"></p>
        <div class="math-board" id="example"></div>
        <div class="math-board" id="as-sum" hidden></div>
        <div class="chip-field" id="chips" role="img" hidden></div>
        <p class="feedback" aria-live="polite" id="explore-status" hidden></p>
        <div class="actions">
          <button type="button" class="primary" id="try-pair">مثال آخر</button>
          <button type="button" class="soft-btn" id="zero-guess" hidden>الناتج صفر</button>
          <button type="button" class="soft-btn" id="both-positive">عددان موجبان</button>
          <button type="button" class="soft-btn" id="reset-cover" hidden>كشف العلامتين</button>
        </div>
      </div>
      <div id="practice" hidden>
        <div class="box-head"><h2 id="question"></h2><span class="count" id="count"></span></div>
        <progress class="progress" id="progress" max="6" value="0" aria-label="الأسئلة المكتملة"></progress>
        <div class="math-board" id="problem"></div>
        <div class="answers" id="choices" role="group" aria-label="اختر إشارة الناتج">
          <button type="button" class="answer" data-answer="1">موجب <bdi dir="ltr">(+)</bdi></button>
          <button type="button" class="answer" data-answer="-1">سالب <bdi dir="ltr">(−)</bdi></button>
          <button type="button" class="answer" data-answer="0">صفر <bdi dir="ltr">(٠)</bdi></button>
        </div>
        <div class="feedback" role="status" id="practice-status" hidden></div>
        <div class="math-board" id="solution" hidden></div>
        <button class="primary" type="button" id="next" hidden>السؤال التالي</button>
      </div>
    </section>
  </div>
</main>
<footer class="wrap foot-inner"><span>أ/ فاطمة هزازي</span><span>ملتقى معلمي ومعلمات الرياضيات · ملتقى التعليم التفاعلي</span></footer>
<script id="app-script">
"use strict";
const $ = selector => document.querySelector(selector);
const $$ = selector => Array.from(document.querySelectorAll(selector));
const digits = "٠١٢٣٤٥٦٧٨٩";
const arabic = number => String(number).replace(/[0-9]/g, digit => digits[digit]);
const operations = {
  "+": { name:"الجمع", read:" زائد ", calculate:(a,b) => a+b },
  "−": { name:"الطرح", read:" ناقص ", calculate:(a,b) => a-b },
  "×": { name:"الضرب", read:" ضرب ", calculate:(a,b) => a*b },
  "÷": { name:"القسمة", read:" مقسوم على ", calculate:(a,b) => a/b }
};
const valueOf = (a, op, b) => operations[op].calculate(a,b);
const additive = op => op === "+" || op === "−";
const signOf = key => key === "mouth" ? 1 : -1;
const signName = number => number === 0 ? "صفر" : number < 0 ? "سالب" : "موجب";
const spoken = value => typeof value === "number"
  ? (value < 0 ? "سالب " : "") + arabic(Math.abs(value))
  : value === "؟" ? "فراغ" : value;
const symbol = (value, asOperand = false) => {
  if (typeof value !== "number") return value;
  if (value >= 0) return arabic(value);
  const negative = "−" + arabic(-value);
  return asOperand ? "(" + negative + ")" : negative;
};
function token(value, className = "", asOperand = false) {
  const item = document.createElement("bdo");
  item.dir = "ltr";
  item.className = "math-token " + className;
  item.textContent = symbol(value, asOperand);
  return item;
}
function group(caption, content) {
  const box = document.createElement("div");
  box.className = "math-group";
  const label = document.createElement("span");
  label.className = "math-caption";
  label.textContent = caption;
  box.append(label, content);
  return box;
}
// DOM order follows Arabic reading order. Grid column 1 starts at the physical right.
// The division operands also run from right (dividend) to left (divisor).
function equation(container, first, op, second, result, resultCaption = "الناتج", operationCaption = "العملية") {
  const row = document.createElement("div");
  row.className = "math-line";
  row.dir = "rtl";
  row.setAttribute("role", "math");
  row.setAttribute("aria-label", spoken(first) + operations[op].read + spoken(second) + " يساوي " + spoken(result));
  const operation = document.createElement("div");
  operation.className = "math-parts";
  operation.dir = "rtl";
  operation.append(token(first, "first", true), token(op), token(second, "second", true));
  const equals = document.createElement("span");
  equals.className = "equals";
  equals.textContent = "=";
  row.append(group(operationCaption, operation), equals, group(resultCaption, token(result, "math-out")));
  container.replaceChildren(row);
}
function notice(el, text, retry = false) {
  el.textContent = text;
  el.hidden = !text;
  el.classList.toggle("retry", retry);
}
// Examples cover unequal magnitudes in both directions, zero and equal magnitudes.
const examples = {
  "+":[[5,-3],[-5,3],[-3,-2],[4,2],[-4,4],[0,-3]],
  "−":[[3,5],[3,-5],[-5,-3],[-3,-5],[4,4],[0,4],[-2,0]],
  "×":[[-3,2],[-3,-2],[3,-2],[3,2]],
  "÷":[[-6,3],[-6,-3],[6,-3],[6,3]]
};
// The operation bank refers to the operation in the displayed question.
// For equations, a, op and b describe the inverse step used to isolate س.
const banks = {
  "+":[{a:4,b:3},{a:-4,b:-3},{a:7,b:-3},{a:-7,b:3},{a:-5,b:5},
    {a:-3,op:"−",b:4,original:["س","+",4,-3],inverse:"نطرح ٤ من الطرفين لعزل س."}],
  "−":[{a:8,b:3},{a:3,b:8},{a:4,b:-2},{a:-7,b:-2},{a:-4,b:-4},
    {a:-2,op:"+",b:5,original:["س","−",5,-2],inverse:"نضيف ٥ إلى الطرفين لعزل س."}],
  "×":[{a:-3,b:-2},{a:-3,b:4},{a:4,b:2},{a:3,b:-5},{a:0,b:-7},
    {a:20,op:"÷",b:-4,original:[-4,"×","س",20],inverse:"نقسم الطرفين على سالب ٤ لعزل س."}],
  "÷":[{a:-6,b:3},{a:-18,b:-3},{a:14,b:2},{a:12,b:-3},{a:0,b:4},
    {a:-6,op:"×",b:3,original:["س","÷",3,-6],inverse:"نضرب الطرفين في ٣ لعزل س."}]
};
let mode = "explore", op = "÷", exampleIndex = 0, covered = [], revealed = false, exploreMessage = "";
const freshProgress = () => ({index:0,solved:false,tried:false,score:0});
const progress = Object.fromEntries(Object.keys(banks).map(key => [key,freshProgress()]));

function additiveExplanation(a, operator, b) {
  const term = operator === "−" ? -b : b;
  const result = a + term;
  const prefix = operator === "−" ? "نحوّل الطرح إلى جمع معكوس العدد الثاني. " : "";
  if (term === 0 || a === 0)
    return prefix + "إضافة الصفر لا تغيّر قيمة العدد الآخر.";
  if (result === 0)
    return prefix + "العددان متعاكسان، فتتلاشى جميع أزواج الموجب والسالب ويكون الناتج صفرًا.";
  if (Math.sign(a) === Math.sign(term))
    return prefix + "نجمع القيمتين المطلقتين ونحتفظ بالإشارة المشتركة. الناتج " + signName(result) + ".";
  const larger = Math.max(Math.abs(a), Math.abs(term)), smaller = Math.min(Math.abs(a), Math.abs(term));
  return prefix + "نطرح " + arabic(smaller) + " من " + arabic(larger) + "، ونأخذ إشارة العدد ذي القيمة المطلقة الأكبر. الناتج " + signName(result) + ".";
}
function explain(a, operator, b) {
  if (additive(operator)) return additiveExplanation(a, operator, b);
  const result = valueOf(a,operator,b);
  if (result === 0) return operator === "×" ? "أحد العاملين صفر، فالناتج صفر." : "قسمة الصفر على عدد غير صفري تعطي صفرًا.";
  return (Math.sign(a) === Math.sign(b) ? "الإشارتان متماثلتان" : "الإشارتان مختلفتان") + "، فالناتج " + signName(result) + ".";
}
function paintFace(mask, enabled, lit, showZero = false) {
  $$(".mark").forEach(button => {
    const key = button.dataset.key, masked = mask.includes(key);
    button.classList.toggle("covered", masked);
    button.classList.toggle("remaining", lit === key);
    button.setAttribute("aria-pressed", String(masked));
    button.disabled = !enabled;
  });
  $("#zero-face").hidden = !showZero;
  $(".face").classList.toggle("zero-result", showZero);
  $(".choice-dots").hidden = additive(op) || mode === "practice";
  $$(".choice-dots i").forEach((dot,index) => dot.classList.toggle("on", index < mask.length));
}
function displaySign(result, mask = [], enabled = false) {
  const lit = result === null || result === 0 ? "" : result > 0 ? "mouth" : mask.includes("right") ? "left" : "right";
  paintFace(mask,enabled,lit,result === 0);
}
function drawChips(a, b) {
  const field = $("#chips");
  field.hidden = false;
  field.replaceChildren();
  const cancel = Math.sign(a) !== Math.sign(b) ? Math.min(Math.abs(a),Math.abs(b)) : 0;
  for (const value of [a,b]) {
    if (value === 0) continue;
    const run = document.createElement("span");
    run.className = "chip-run";
    for (let i = 0; i < Math.abs(value); i++) {
      const chip = document.createElement("span");
      chip.className = "chip " + (value > 0 ? "plus" : "minus") + (revealed && i < cancel ? " cancelled" : "");
      chip.textContent = value > 0 ? "+" : "−";
      run.append(chip);
    }
    field.append(run);
  }
  const name = v => arabic(Math.abs(v)) + (v < 0 ? " قطع سالبة" : " قطع موجبة");
  field.setAttribute("aria-label", name(a) + " و" + name(b) + (revealed ? "، أزواج التلاشي " + arabic(cancel) : ""));
}
function resetCover() { covered = []; revealed = false; exploreMessage = ""; }
function renderExplore() {
  const [a,b] = examples[op][exampleIndex], n = valueOf(a,op,b);
  const useChips = additive(op), bothPositive = a > 0 && b > 0;
  $("#explore-title").textContent = "استكشف " + operations[op].name;
  equation($("#example"),a,op,b,revealed ? n : "؟");
  $("#as-sum").hidden = op !== "−";
  if (op === "−") equation($("#as-sum"),a,"+",-b,revealed ? n : "؟","الناتج","الجمع المكافئ");
  $("#chips").hidden = !useChips;
  if (useChips) {
    drawChips(a,op === "−" ? -b : b);
    displaySign(revealed ? n : null, [], !revealed);
    $("#instruction").textContent = op === "−" ? "أبقِ العدد الأول، وحوّل الطرح إلى جمع معكوس العدد الثاني. كل زوج موجب وسالب يتلاشى." : "كل قطعة تمثّل وحدة. تخيّل حذف كل زوج من قطعة موجبة وقطعة سالبة، ثم اختر إشارة ما تبقّى.";
    $("#face-note").textContent = revealed ? (n === 0 ? "الناتج صفر، فلا يحمل إشارة." : "إشارة الناتج مضاءة على الوجه.") : "اختر عينًا للسالب أو الفم للموجب، أو اختر «الناتج صفر».";
  } else {
    displaySign(revealed ? n : null, covered, !bothPositive);
    $("#instruction").textContent = bothPositive ? "توقّع إشارة الناتج، ثم اكشفها." : "غطِّ على الوجه الإشارتين المطابقتين للعددين.";
    $("#face-note").textContent = bothPositive ? "للعددين الموجبين نستخدم قاعدة تماثل الإشارتين." : revealed ? "العلامة الظاهرة هي إشارة الناتج." : covered.length ? "بقيت إشارة واحدة لتغطيتها." : "المس عينًا للسالب، أو الفم للموجب.";
  }
  notice($("#explore-status"),revealed ? explain(a,op,b) : exploreMessage, !revealed && Boolean(exploreMessage));
  $("#zero-guess").hidden = !useChips || revealed;
  $("#both-positive").hidden = useChips || (bothPositive && revealed);
  $("#both-positive").textContent = bothPositive ? "إظهار الناتج" : "عددان موجبان";
  $("#reset-cover").hidden = !revealed && covered.length === 0;
  $("#reset-cover").textContent = useChips || bothPositive ? "إخفاء الناتج" : "كشف الإشارات";
}
function guessAdditive(sign) {
  const [a,b] = examples[op][exampleIndex];
  revealed = sign === Math.sign(valueOf(a,op,b));
  exploreMessage = revealed ? "" : "أعد عدّ القطع بعد حذف الأزواج المتعاكسة. ما نوع القطع المتبقية؟";
  renderExplore();
}
function pickMark(key) {
  if (additive(op)) { guessAdditive(signOf(key)); return; }
  if (covered.includes(key)) {
    covered = covered.filter(item => item !== key);
    revealed = false; exploreMessage = "";
  } else if (!revealed) {
    const signs = examples[op][exampleIndex].map(Math.sign), selectedSign = signOf(key);
    const available = signs.filter(sign => sign === selectedSign).length;
    const used = covered.filter(item => signOf(item) === selectedSign).length;
    if (used < available) {
      covered.push(key); revealed = covered.length === 2; exploreMessage = "";
    } else exploreMessage = "راجع إشارتَي العددين، ثم اختر العلامة المطابقة على الوجه.";
  }
  renderExplore();
}
function currentQuestion() { return banks[op][progress[op].index]; }
function renderPractice() {
  const state = progress[op], questions = banks[op], q = currentQuestion();
  const operator = q.op || op, n = valueOf(q.a,operator,q.b);
  let mask = [];
  if (state.solved && !additive(operator) && n !== 0 && (q.a < 0 || q.b < 0))
    mask = q.a < 0 && q.b < 0 ? ["left","right"] : ["left","mouth"];
  displaySign(state.solved ? n : null, mask);
  $("#face-note").textContent = state.solved ? (n === 0 ? "الناتج صفر، فلا يحمل إشارة." : "الناتج " + signName(n) + ".") : "اختر الإجابة لتظهر إشارة الناتج على الوجه.";
  $("#count").textContent = "السؤال " + arabic(state.index+1) + " من " + arabic(questions.length);
  $("#progress").max = questions.length;
  $("#progress").value = state.index + Number(state.solved);
  $("#question").textContent = q.original ? "ما إشارة قيمة س؟" : "ما إشارة الناتج؟";
  if (q.original) equation($("#problem"),...q.original,"القيمة المعطاة");
  else equation($("#problem"),q.a,operator,q.b,state.solved ? n : "؟");
  $("#solution").hidden = !(q.original && state.solved);
  if (q.original && state.solved) equation($("#solution"),q.a,operator,q.b,n,"قيمة س");
  $("#choices").hidden = state.solved;
  $("#next").hidden = !state.solved;
  $("#next").textContent = state.index === questions.length-1 ? "إعادة تدريب " + operations[op].name : "السؤال التالي";
  let message = "";
  if (state.solved) {
    message = "إجابة صحيحة. " + (q.inverse ? q.inverse+" " : "") + explain(q.a,operator,q.b);
    if (state.index === questions.length-1) message += " إجاباتك الصحيحة من المحاولة الأولى: " + arabic(state.score) + " من " + arabic(questions.length) + ".";
  } else if (state.tried) {
    const hint = additive(operator) ? "وازن الوحدات الموجبة والسالبة عند الجمع." : "انتبه إلى الصفر، ثم قارن الإشارتين.";
    message = (q.inverse || (operator === "−" ? "حوّل الطرح إلى جمع معكوس العدد الثاني." : "")) + " " + hint + " حاول مرة أخرى.";
  }
  notice($("#practice-status"),message,state.tried && !state.solved);
}
function render() {
  $$("[data-mode]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.mode === mode)));
  $$("[data-op]").forEach(button => button.setAttribute("aria-pressed", String(button.dataset.op === op)));
  $("#explore").hidden = mode !== "explore";
  $("#practice").hidden = mode !== "practice";
  if (mode === "explore") renderExplore(); else renderPractice();
}
$$("[data-mode]").forEach(button => button.addEventListener("click", () => { mode = button.dataset.mode; render(); }));
$$("[data-op]").forEach(button => button.addEventListener("click", () => {
  if (op === button.dataset.op) return;
  op = button.dataset.op; exampleIndex = 0; resetCover(); render();
}));
$$(".mark").forEach(button => button.addEventListener("click", () => pickMark(button.dataset.key)));
$("#zero-guess").addEventListener("click", () => guessAdditive(0));
$("#try-pair").addEventListener("click", () => { exampleIndex = (exampleIndex+1) % examples[op].length; resetCover(); renderExplore(); });
$("#reset-cover").addEventListener("click", () => { resetCover(); renderExplore(); });
$("#both-positive").addEventListener("click", () => {
  const last = examples[op].length - 1;
  const wasPositive = exampleIndex === last;
  exampleIndex = last; resetCover(); revealed = wasPositive; renderExplore();
});
$$("[data-answer]").forEach(button => button.addEventListener("click", () => {
  const state = progress[op], q = currentQuestion();
  if (state.solved) return;
  state.solved = Number(button.dataset.answer) === Math.sign(valueOf(q.a,q.op || op,q.b));
  if (state.solved && !state.tried) state.score++;
  if (!state.solved) state.tried = true;
  renderPractice();
  if (state.solved) $("#next").focus({preventScroll:true});
}));
$("#next").addEventListener("click", () => {
  const state = progress[op];
  if (state.index === banks[op].length-1) progress[op] = freshProgress();
  else { state.index++; state.solved = false; state.tried = false; }
  renderPractice(); $("[data-answer]").focus({preventScroll:true});
});

function theme(dark) {
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#theme").setAttribute("aria-label", dark ? "تفعيل الوضع النهاري" : "تفعيل الوضع الليلي");
  $("#theme").setAttribute("aria-pressed", String(dark));
  document.querySelector('meta[name="theme-color"]').content = dark ? "#15231f" : "#f8f7f2";
}
let defaultDark = window.matchMedia("(prefers-color-scheme:dark)").matches;
try {
  const saved = localStorage.getItem("sign-face-theme");
  if (saved) defaultDark = saved === "dark";
} catch {}
theme(defaultDark);
$("#theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark"; theme(dark);
  try { localStorage.setItem("sign-face-theme", dark ? "dark" : "light"); } catch {}
});

render();
</script>
</body>
</html>
